name: PHP CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Conserver le nom du contrôle Cyber 2 pour les règles existantes de la branche.
  php-lint:
    name: Vérification syntaxe PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Vérifier la syntaxe PHP
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './var/*' -print0 | xargs -0 -r -n1 php -l
  tests:
    name: Tests de sécurité (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: cyber3_test
          MYSQL_USER: cyber3_test
          MYSQL_PASSWORD: cyber3_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: test
      DATABASE_URL: 'mysql://cyber3_test:cyber3_test@127.0.0.1:3306/cyber3?serverVersion=8.4&charset=utf8mb4'
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, mbstring, dom, xml, pdo_mysql, intl
          coverage: none
      - name: Installer les dépendances verrouillées sans modifier les recettes
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
          composer dump-autoload --no-interaction --no-scripts
      - name: Vérifier la syntaxe et la configuration
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php bin/console lint:container
          php bin/console lint:twig templates
          php bin/console lint:yaml config
      - name: Préparer uniquement la base dédiée aux tests
        run: php bin/prepare-test-db.php
      - name: Exécuter PHPUnit
        run: vendor/bin/phpunit --log-junit var/test-results/junit.xml
      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-php-${{ matrix.php }}
          path: var/test-results/junit.xml
          if-no-files-found: ignore
